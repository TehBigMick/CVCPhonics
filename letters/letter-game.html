<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="A six-round individual letter game for early learners."><meta name="theme-color" content="#f8f4ec"><title>Individual Letter Game | Michael's Phonics Hub</title><link rel="stylesheet" href="../styles/main.css"><link rel="stylesheet" href="../styles/alphabet.css"></head><body class="activity-page"><a class="skip-link" href="#activity">Skip to the letter game</a><header class="activity-header"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true"><span>M</span><span>P</span><span>H</span></span><span class="brand-name">Michael's <strong>Phonics Hub</strong></span></a><a class="exit-link" href="index.html">All alphabet activities</a></header><main id="activity" class="activity-shell alphabet-activity">
