<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Trace capital and small letters A–Z on an interactive drawing board."><meta name="theme-color" content="#f8f4ec"><title>Trace and Say | Michael's Phonics Hub</title><link rel="stylesheet" href="../styles/main.css"><link rel="stylesheet" href="../styles/alphabet.css"></head><body class="activity-page"><a class="skip-link" href="#activity">Skip to tracing board</a><header class="activity-header"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true"><span>M</span><span>P</span><span>H</span></span><span class="brand-name">Michael's <strong>Phonics Hub</strong></span></a><a class="exit-link" href="index.html">All alphabet activities</a></header><main id="activity" class="activity-shell alphabet-activity"><section class="quiz-card alphabet-activity-card"><p class="kicker">Make and say</p><h1>Trace a letter</h1><p class="letter-lead">Choose a letter, trace over the pale shape, then say its picture word.</p><div class="trace-controls"><button id="trace-previous" class="button button-secondary" type="button">← Previous</button><label>Letter<select id="trace-letter" aria-label="Choose a letter"></select></label><label>Letter shape<select id="trace-case"><option value="upper">Capital letter</option><option value="lower">Small letter</option></select></label><button id="trace-next" class="button button-secondary" type="button">Next →</button></div><div class="trace-board"><canvas id="trace-canvas" aria-label="Drawing board for tracing the selected letter"></canvas></div><p id="trace-word" class="trace-word">A is for Apple 🍎</p><div class="control-row"><button id="trace-hear" class="listen-button" type="button">🔊 Hear letter and word</button><button id="trace-clear" class="button button-secondary" type="button">Clear my lines</button></div></section></main><script type="module" src="../scripts/alphabet-trace.js"></script></body></html>
