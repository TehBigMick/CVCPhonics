<!DOCTYPE html>
<html lang="en-GB" data-quiz-type="cvc">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4ec">
  <title>CVC reading check | Michael's Phonics Hub</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body class="activity-page">
  <a class="skip-link" href="#activity">Skip to reading check</a>
  <header class="activity-header">
    <a class="brand" href="../index.html" aria-label="Michael's Phonics Hub home">
      <span class="brand-mark" aria-hidden="true"><span>M</span><span>P</span><span>H</span></span>
      <span class="brand-name">Michael's <strong>Phonics Hub</strong></span>
    </a>
    <a class="exit-link" href="index.html">Exit check</a>
  </header>

  <main id="activity" class="activity-shell">
    <section id="quiz-container" class="quiz-card" aria-labelledby="level-title">
      <div class="quiz-heading">
        <div>
          <p class="kicker">Teacher-led reading check</p>
          <h1 id="level-title">Level A</h1>
        </div>
        <p id="counter" class="counter">Word 1 of 25</p>
      </div>
      <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>

      <p class="quiz-prompt">Can the learner read this word independently?</p>
      <div id="word" class="word-display" aria-live="polite">cat</div>

      <div class="answer-grid">
        <button id="no-btn" class="answer-button answer-practise" type="button">
          <span class="answer-icon" aria-hidden="true">↻</span>
          <span><strong>Needs practice</strong><small>Save this word to review</small></span>
        </button>
        <button id="yes-btn" class="answer-button answer-read" type="button">
          <span class="answer-icon" aria-hidden="true">✓</span>
          <span><strong>Read it</strong><small>Independent and correct</small></span>
        </button>
      </div>
      <div class="quiz-footer-row">
        <button id="undo-btn" class="undo-button" type="button" disabled>← Undo last answer</button>
        <p class="key-hint"><kbd>←</kbd> needs practice <kbd>→</kbd> read it</p>
      </div>
    </section>

    <section id="result-container" class="result-card" hidden aria-live="polite"></section>
  </main>

  <script type="module" src="../scripts/quiz-app.js"></script>
</body>
</html>
